name: Remove Test CUDA label

on:
  pull_request_target:
    types:
      - labeled

jobs:
  remove_label:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.repository_owner == 'deepmodeling' && github.event.label.name == 'Test CUDA'
    steps:
      - name: Remove Test CUDA label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/Test%20CUDA"
