[build-system]
requires = [
    "scikit-build-core>=0.3.0",
    "torch>=2.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "deepmd-gnn"
dynamic = ["version"]
description = "DeePMD-kit plugin for graph neural network models."
authors = [
    { name = "Jinzhe Zeng", email = "jinzhe.zeng@ustc.edu.cn"},
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
]
dependencies = [
    "torch>=2.10",
    "deepmd-kit[torch]>=3.0.0",
    "mace-torch>=0.3.5",
    "nequip<0.7",
    "e3nn",
    "dargs",
]
requires-python = ">=3.10"
readme = "README.md"
keywords = [
]

[project.scripts]
deepmd-gnn = "deepmd_gnn.cli:main"

[project.entry-points."deepmd.pt"]
mace = "deepmd_gnn.pt:load"
nequip = "deepmd_gnn.pt:load"

[project.entry-points."deepmd.pt_expt"]
mace = "deepmd_gnn.pt_expt:load"

[project.urls]
repository = "https://gitlab.com/RutgersLBSR/deepmd-gnn"

[project.optional-dependencies]
cueq = [
    "cuequivariance>=0.10.0",
    "cuequivariance-torch>=0.10.0",
    "cuequivariance-ops-torch-cu12>=0.10.0",
]
cueq-cu11 = [
    "cuequivariance>=0.10.0",
    "cuequivariance-torch>=0.10.0",
    "cuequivariance-ops-torch-cu11>=0.10.0",
]
cueq-cu12 = [
    "cuequivariance>=0.10.0",
    "cuequivariance-torch>=0.10.0",
    "cuequivariance-ops-torch-cu12>=0.10.0",
]
test = [
    'pytest',
    'pytest-cov',
    "dargs>=0.4.8",
]
docs = [
    "sphinx",
    "sphinx-autoapi",
    "myst-parser",
    "deepmodeling-sphinx>=0.3.0",
    "sphinx-book-theme",
    "dargs",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that exercise real checkpoint downloads / conversions",
    "lammps: tests that require a LAMMPS executable or Python module",
    "mpi: tests that require MPI executables",
]

[tool.scikit-build]
wheel.py-api = "py2.py3"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = [
    "/deepmd_gnn/_version.py",
]

[tool.scikit-build.cmake.define]
BUILD_PY_IF = true
BUILD_CPP_IF = false

[tool.setuptools_scm]
version_file = "deepmd_gnn/_version.py"

[tool.ruff]
extend-exclude = [
    "third_party/implib",
]

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "CPY001", # Licensing is declared with SPDX identifiers and the project LICENSE.
    "PLR0912",
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # DeePMD/Torch interfaces require positional-compatible signatures.
    "PLR0915",
    "PLR2004",
    "FBT001",
    "FBT002",
    "N803",
    "FA100",
    "S603",
    "C901",
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"deepmd_gnn/mace.py" = [
    "TC002", # TorchScript-facing module keeps some runtime-imported types
    "UP045", # TorchScript is sensitive to Optional/type-annotation rewrites
    "FA102", # avoid forcing future annotations in TorchScript-facing module
]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests...
    "ANN",
    "D101",
    "D102",
]
"docs/conf.py" = [
    "ERA001",
    "INP001",
]

[tool.coverage.report]
include = ["deepmd_gnn/*"]


[tool.cibuildwheel]
test-command = [
    """python -c "import deepmd_gnn.op" """,
]
build = ["cp312-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:latest"
manylinux-aarch64-image = "quay.io/manylinux_cuda/manylinux_2_28_aarch64_cuda12_9:latest"

[tool.cibuildwheel.macos]
repair-wheel-command = """delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} --ignore-missing-dependencies"""

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude libc10.so --exclude libtorch.so --exclude libtorch_cpu.so -w {dest_dir} {wheel}"
environment-pass = [
    "CIBW_BUILD",
]
[tool.cibuildwheel.linux.environment]
# use CPU version of torch for building, which should also work for GPU
# note: uv has different behavior from pip on extra index url
# https://github.com/astral-sh/uv/blob/main/PIP_COMPATIBILITY.md#packages-that-exist-on-multiple-indexes
UV_EXTRA_INDEX_URL = "https://download.pytorch.org/whl/cpu"
